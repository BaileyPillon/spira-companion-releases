name: Gameplay or setup problem
description: Report an incorrect reading, a guide that loses its place, or a connection problem.
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Final Fantasy X International
        - Final Fantasy X-2 USA
        - Final Fantasy X-2 International
        - Setup or both games
        - Other or unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spira Companion version
      description: Include the ARMSX2 version if you know it.
      placeholder: Spira version and ARMSX2 version
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Tell us what the game showed, what Spira showed and what you expected.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where can we reproduce it?
      description: The area, chapter, fight or last few steps are helpful. For a connection issue, include the status text, disc serial and CRC if available.
