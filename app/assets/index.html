<body>
<header>
  <div class="identity"><img src="spira-icon.webp" width="36" height="36" alt=""><span>Spira Companion</span></div>
  <div class="shell-actions">
    <div id="connection" class="connection" role="status" data-state="waiting">Waiting</div>
    <button id="focus-view" type="button" hidden aria-pressed="false">Focus</button>
    <button id="display-settings" type="button" aria-haspopup="dialog">Display</button>
  </div>
</header>
<div id="glance-toolbar" hidden>
  <button id="glance-exit">Exit Glance</button>
  <span id="glance-connection" class="connection" role="status"></span>
  <button id="glance-dim">Shade screen</button>
</div>
<div class="layout">
  <nav aria-label="Companion views">
    <button id="tool-library" aria-haspopup="dialog">All tools</button>
    <button data-tab="status" aria-current="page">Status</button>
    <button data-tab="glance">Glance</button>
    <button data-tab="workspace">Workspace</button>
    <button data-tab="planner" data-ffx hidden>Goal Plan</button>
    <button data-tab="guide">Guide</button>
    <button data-tab="party">Party</button>
    <button data-tab="supplies">Items</button>
    <button data-tab="mix" data-mix hidden>Mix</button>
    <button data-tab="equip" hidden>Equip</button>
    <button data-tab="prep" data-ffx hidden>Boss Prep</button>
    <button data-tab="grid" data-ffx hidden>Sphere Grid</button>
    <button data-tab="bestiary" data-ffx hidden>Bestiary</button>
    <button data-tab="x2-bestiary" hidden>Bestiary</button>
    <button data-tab="arena" data-ffx hidden>Arena</button>
    <button data-tab="blitzball" data-ffx hidden>Blitzball</button>
    <button data-tab="challenges" hidden>Challenges</button>
    <button data-tab="map" data-ps2 hidden>Map</button>
    <button data-tab="missables" data-progress hidden>Missables</button>
    <button data-tab="collections" data-progress hidden>Collections</button>
    <button data-tab="chapter-checklist" hidden>Chapter Checklist</button>
    <button data-tab="field-guide" hidden>Fiend Guide</button>
    <button data-tab="journal">Journal</button>
    <button data-tab="cheats" hidden>Cheats</button>
    <button data-tab="setup" class="setup-link">Setup</button>
  </nav>
  <main id="panel" tabindex="-1"></main>
  <section id="guide" class="guide-reader" aria-label="Jegged walkthrough" hidden></section>
</div>
<dialog id="shell-dialog" aria-labelledby="shell-dialog-title"></dialog>
<button id="glance-shade" hidden aria-label="Wake Glance"></button>
</body>
